<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Screen Test</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800;900&family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #0755C9;
            --deep-navy: #092B67;
            --sky-blue: #38BDF8;
            --accent-orange: #FF8A00;
            --accent-gold: #FFB52E;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            min-height: 100%;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
            overflow-x: hidden;
        }

        /* 1. Full Screen Viewport: ZERO sidebars, edge-to-edge cover */
        .auth-viewport {
            width: 100vw;
            min-height: 100vh;
            background-image: url('../public/uploads/catalog/BgMasuk.png');
            background-size: cover;
            background-position: center top;
            background-repeat: no-repeat;
            background-attachment: fixed;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            position: relative;
            overflow-x: hidden;
            overflow-y: auto;
        }

        /* Ambient light overlay for extra contrast while preserving 100% of the image */
        .auth-viewport::before {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, rgba(255, 255, 255, 0.05) 0%, rgba(9, 43, 103, 0.12) 100%);
            pointer-events: none;
            z-index: 1;
        }

        /* 2. Content Center Column: Aligned between building (left) and equipment (right) */
        .auth-content-container {
            width: 100%;
            max-width: 440px;
            margin: 0 auto;
            /* Safe distance from top so OTW logo & slogan in the sky remain completely unobstructed */
            padding-top: clamp(140px, 23.5vh, 260px);
            padding-bottom: 30px;
            padding-left: 16px;
            padding-right: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 2;
        }

        /* 3. Headline Promosi yang Menarik */
        .hero-promo-header {
            text-align: center;
            margin-bottom: clamp(14px, 2vh, 22px);
            width: 100%;
            max-width: 520px;
        }

        .promo-title {
            font-family: 'Poppins', 'Plus Jakarta Sans', sans-serif;
            font-weight: 900;
            font-size: clamp(24px, 2.5vw, 38px);
            line-height: 1.18;
            letter-spacing: -0.025em;
            color: #073B91;
            margin: 0;
            text-shadow: 
                0 2px 10px rgba(255, 255, 255, 0.95),
                0 4px 20px rgba(255, 255, 255, 0.85),
                0 4px 18px rgba(7, 59, 145, 0.15);
        }

        .promo-title .line-1 {
            display: block;
            color: #073B91;
        }

        .promo-title .line-2 {
            display: block;
            color: #092B67;
            margin-top: 2px;
        }

        .promo-title .text-gradient-orange {
            background: linear-gradient(90deg, #FF8A00 0%, #FFB52E 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
        }

        /* 4. Glassmorphism Login Card (380-420px desktop, 28px border-radius) */
        .auth-card-wrapper {
            width: 100%;
            max-width: 410px;
        }

        .glass-auth-card {
            background: rgba(255, 255, 255, 0.68);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1.5px solid rgba(255, 255, 255, 0.85);
            border-radius: 28px;
            padding: 30px 28px;
            box-shadow: 
                0 20px 45px -10px rgba(7, 59, 145, 0.18),
                0 0 0 1px rgba(255, 255, 255, 0.7) inset,
                inset 0 1px 2px rgba(255, 255, 255, 0.95);
            text-align: center;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        /* Ambient glow at bottom curve */
        .glass-auth-card::after {
            content: '';
            position: absolute;
            bottom: -15px;
            left: -15px;
            right: -15px;
            height: 100px;
            background: 
                radial-gradient(circle at 12% 100%, rgba(7, 85, 201, 0.18) 0%, transparent 65%),
                radial-gradient(circle at 88% 100%, rgba(255, 138, 0, 0.18) 0%, transparent 65%);
            pointer-events: none;
            border-radius: 0 0 28px 28px;
            z-index: 0;
        }

        .glass-auth-card > * {
            position: relative;
            z-index: 1;
        }

        /* Icon Badge Top */
        .auth-icon-badge {
            width: 50px;
            height: 50px;
            background: #FFFFFF;
            border-radius: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            box-shadow: 0 8px 18px -4px rgba(7, 85, 201, 0.15), 0 0 0 1px rgba(255, 255, 255, 0.9);
            color: var(--primary-blue);
        }

        .auth-icon-badge svg {
            width: 24px;
            height: 24px;
        }

        .auth-title {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 800;
            font-size: 1.5rem;
            color: #092B67;
            margin-bottom: 6px;
            letter-spacing: -0.025em;
        }

        .auth-subtitle {
            font-size: 0.82rem;
            color: #475569;
            line-height: 1.5;
            margin-bottom: 18px;
            max-width: 330px;
            margin-left: auto;
            margin-right: auto;
        }

        .form-label-custom {
            font-size: 0.82rem;
            font-weight: 700;
            color: #092B67;
            display: block;
            text-align: left;
            margin-bottom: 6px;
        }

        .phone-input-group {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.94);
            border: 1.5px solid rgba(7, 85, 201, 0.3);
            border-radius: 14px;
            height: 50px;
            overflow: hidden;
            transition: all 0.25s ease;
            box-shadow: 0 2px 6px rgba(7, 59, 145, 0.04);
        }

        .phone-input-group:focus-within {
            border-color: var(--primary-blue);
            background: #FFFFFF;
            box-shadow: 0 0 0 4px rgba(7, 85, 201, 0.15);
        }

        .phone-country-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 0 14px;
            font-size: 0.92rem;
            font-weight: 700;
            color: #092B67;
            border-right: 1.5px solid #E2E8F0;
            user-select: none;
            height: 100%;
            background: transparent;
        }

        .phone-flag { font-size: 1.15rem; line-height: 1; }
        .phone-arrow { font-size: 0.7rem; color: #94A3B8; }

        .phone-number-field {
            flex: 1;
            height: 100%;
            border: none;
            background: transparent;
            padding: 0 14px;
            font-size: 1rem;
            font-weight: 600;
            color: #092B67;
            outline: none;
        }

        .phone-number-field::placeholder {
            color: #94A3B8;
            font-weight: 400;
        }

        .security-badge-note {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #475569;
            font-size: 0.76rem;
            text-align: left;
            margin-top: 8px;
            margin-bottom: 20px;
        }

        .security-badge-note svg {
            width: 16px;
            height: 16px;
            color: var(--primary-blue);
            flex-shrink: 0;
        }

        .btn-gradient-auth {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            height: 50px;
            border-radius: 9999px;
            border: none;
            background: linear-gradient(90deg, #0755C9 0%, #155EEF 40%, #FF8A00 100%);
            background-size: 150% auto;
            color: #FFFFFF;
            font-size: 0.98rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 
                0 10px 24px -4px rgba(7, 85, 201, 0.4),
                0 6px 12px -2px rgba(255, 138, 0, 0.25);
            text-decoration: none;
        }

        .btn-gradient-auth:hover {
            background-position: right center;
            transform: translateY(-2px);
            box-shadow: 
                0 14px 28px -4px rgba(7, 85, 201, 0.45),
                0 8px 16px -2px rgba(255, 138, 0, 0.3);
            color: #FFFFFF;
        }

        .btn-gradient-auth svg { width: 20px; height: 20px; fill: currentColor; }

        .auth-help-link {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            margin-top: 14px;
            color: #475569;
            font-size: 0.82rem;
            font-weight: 600;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .auth-help-link:hover { color: var(--primary-blue); }
        .auth-help-link svg { width: 15px; height: 15px; }

        /* Media Queries */
        @media (max-width: 767.98px) {
            .auth-content-container {
                padding-top: max(24px, 16vh);
                max-width: 94%;
            }
            .promo-title {
                font-size: clamp(20px, 6vw, 28px);
            }
            .glass-auth-card {
                padding: 24px 20px;
                border-radius: 24px;
            }
        }

        @media (max-height: 700px) and (min-width: 768px) {
            .auth-content-container {
                padding-top: 150px;
                padding-bottom: 20px;
            }
            .hero-promo-header {
                margin-bottom: 10px;
            }
            .promo-title {
                font-size: 26px;
            }
            .glass-auth-card {
                padding: 20px 22px;
            }
            .auth-subtitle {
                margin-bottom: 12px;
            }
            .security-badge-note {
                margin-bottom: 12px;
            }
        }
    </style>
</head>
<body>
    <main class="auth-viewport">
        <div class="auth-content-container">
            <!-- Headline Promosi -->
            <div class="hero-promo-header">
                <h1 class="promo-title">
                    <span class="line-1">Solusi Sewa Alat &amp; Perlengkapan</span>
                    <span class="line-2">Lebih <span class="text-gradient-orange">Mudah dan Cepat</span></span>
                </h1>
            </div>

            <!-- Glassmorphism Card -->
            <div class="auth-card-wrapper">
                <div class="glass-auth-card">
                    <div class="auth-icon-badge">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="5" y="2" width="14" height="20" rx="3" ry="3"></rect>
                            <line x1="12" y1="18" x2="12.01" y2="18" stroke-width="2.5"></line>
                        </svg>
                    </div>

                    <h2 class="auth-title">Masuk ke Akun Anda</h2>
                    <p class="auth-subtitle">Masukkan nomor telepon Anda. Kami akan mengirimkan kode OTP melalui WhatsApp untuk verifikasi.</p>

                    <form>
                        <div class="text-start mb-2">
                            <label class="form-label-custom">Nomor Telepon</label>
                            <div class="phone-input-group">
                                <div class="phone-country-pill">
                                    <span class="phone-flag">🇮🇩</span>
                                    <span>+62</span>
                                    <span class="phone-arrow">▼</span>
                                </div>
                                <input type="tel" class="phone-number-field" placeholder="8xxxxxxxxxx">
                            </div>
                        </div>

                        <div class="security-badge-note">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                                <polyline points="9 12 11 14 15 10"></polyline>
                            </svg>
                            <span>Kami tidak membagikan nomor Anda kepada pihak lain.</span>
                        </div>

                        <button type="button" class="btn-gradient-auth">
                            <svg viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/></svg>
                            <span>Kirim Kode OTP</span>
                        </button>
                    </form>

                    <a href="#" class="auth-help-link">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"></circle>
                            <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
                            <line x1="12" y1="17" x2="12.01" y2="17"></line>
                        </svg>
                        <span>Butuh Bantuan?</span>
                    </a>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
